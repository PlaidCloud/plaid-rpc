[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "plaidcloud-rpc"
authors = [
    {name = "Michael Rea", email = "mike@plaidcloud.com"},
    {name = "Paul Morel", email = "paul@plaidcloud.com"},
]
maintainers = [
    {name = "Pat Buxton", email = "pat@plaidcloud.com"},
    {name = "Charlie Laymon", email = "charlie@plaidcloud.com"},
    {name = "Simon Moscrop", email = "simon@plaidcloud.com"},
]
description = "PlaidCloud RPC Connection tools and helpers"
requires-python = ">=3.10"
keywords = ["plaidcloud", "rpc", "connection"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version", "readme", "dependencies"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]

[project.optional-dependencies]
test = [
    "chardet>=2.3.0",
    "databend_sqlalchemy",
    "databricks-sqlalchemy",
    "pandas",
    "pyarrow",
    "pytest",
    "mock",
    "minimock",
    "psycopg2-binary",
    "pytest-cov",
    "pytest-runner",
    "python-dateutil>=1.5.0",
    "python-magic>=0.4.12",
    "sqlalchemy-greenplum",
    "sqlalchemy-hana",
    "starrocks",
    "snowflake-sqlalchemy",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "redis",
]
full = [
    "chardet>=2.3.0",
    "databend_sqlalchemy",
    "psycopg2-binary",
    "pyarrow",
    "python-dateutil>=1.5.0",
    "python-magic>=0.4.12",
]
# Services that call init_tracing() install this extra; the OTLP/gRPC exporter pulls in
# grpcio, kept out of the base dependency every plaidcloud.rpc consumer gets.
tracing = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "redis",
]

[project.urls]
Homepage = "https://plaidcloud.com"
Documentation = "https://docs.plaidcloud.com"
Repository = "https://github.com/PlaidCloud/plaid-rpc.git"
Issues = "https://github.com/PlaidCloud/plaid-rpc/issues"

[tool.black]
line-length = 125
target-version = ['py312']
skip-string-normalization = true

[tool.pytest.ini_options]
addopts = "--tb=native -v -r sfxX --maxfail=25 -p no:warnings -p no:logging --doctest-modules"

[tool.coverage.run]
omit = [
    "plaidcloud/rpc/tests/*",
    "plaidcloud/rpc/pcm_connection.py",
    "plaidcloud/rpc/alteryx_parser.py",
]

[tool.coverage.report]
include = ["./plaidcloud/*"]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
