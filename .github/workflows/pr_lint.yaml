name: Lint and Test PlaidCloud RPC
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
env:
  PYTHON_VERSION: '3.12'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read

jobs:
  reviewdog:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint PlaidCloud RPC w ReviewDog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 5
    steps:
      - name: Ensure python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.11.10"
      - name: Install dependencies
        run: |
          uv pip install --system -e .[full]
          uv pip install --system -q ruff
      - name: Install ReviewDog
        uses: reviewdog/action-setup@v1
      - name: Perform Ruff Lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check plaidcloud --output-format=concise --exit-zero 2>&1 | reviewdog -efm="%f:%l:%c: %m" -name="Ruff" -reporter=github-check -level=warning -fail-level=error
  license:
    if: ${{ !github.event.pull_request.draft }}
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # The extras are the set plaid installs in production; [test] is dev-only
      # and out of scope. Policy and tooling live in the action, so a license
      # decision is made once for the organisation rather than per repo.
      - name: Check dependency licenses
        uses: PlaidCloud/plaidcloud-github-actions/license-check@v1
        with:
          extras: full,tracing
          python-version: ${{ env.PYTHON_VERSION }}
  test:
    if: ${{ !github.event.pull_request.draft }}
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Ensure python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run pytest with coverage
        run: |
          pytest plaidcloud/rpc/tests/ -v \
            --cov=plaidcloud.rpc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100 \
            --junitxml=test-results.xml
      - name: Test Results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: test-results.xml
          check_name: Test Results
      - name: Pytest Coverage Comment
        if: always()
        uses: MishaKav/pytest-coverage-comment@v1.12.3
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: test-results.xml
  audit:
    if: ${{ !github.event.pull_request.draft }}
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checkout code
        uses: actions/checkout@v7
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit -e ".[full,tracing]"
          pip-audit --skip-editable
